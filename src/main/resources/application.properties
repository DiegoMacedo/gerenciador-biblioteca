# Swagger UI disponível também no jar final: http://localhost:8080/q/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Gerenciador de Biblioteca API
quarkus.smallrye-openapi.info-version=1.0.0

# Campos desconhecidos no JSON são ignorados, facilitando a evolução do contrato
quarkus.jackson.fail-on-unknown-properties=false
